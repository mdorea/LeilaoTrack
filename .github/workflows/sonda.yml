name: Sonda (temporária)
on:
  workflow_dispatch:
    inputs:
      urls: {description: "URLs separadas por espaço", required: true}
permissions: {contents: write}
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p saida && python3 .github/sonda/sonda.py ${{ inputs.urls }} > saida/relatorio.txt 2>&1 || true
      - name: guardar no ramo sonda
        run: |
          cd saida && git init -q -b sonda && git add -A
          git -c user.name=sonda -c user.email=sonda@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda
