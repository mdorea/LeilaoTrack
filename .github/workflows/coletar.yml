name: Atualizar lotes

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 horas
  workflow_dispatch: {}       # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar criptografia
        run: pip install cryptography
      - id: pages
        uses: actions/configure-pages@v5
      - name: Ler os sites
        env:
          URL_PUBLICADA: ${{ steps.pages.outputs.base_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LT_ACESSO: ${{ secrets.LT_ACESSO }}
        run: python coletar_nuvem.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
