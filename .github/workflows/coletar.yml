name: Atualizar lotes

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 horas
  workflow_dispatch: {}       # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Manter o agendamento ativo
        # o GitHub pausa agendamentos de repositórios sem commits há 60 dias;
        # se o último commit tiver mais de 40 dias, faz um commit vazio
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 40*86400 )) ]; then
            git config user.name "leilaotrack-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter atualizações automáticas ativas"
            git push
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar criptografia
        run: pip install cryptography
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Ler os sites
        env:
          URL_PUBLICADA: ${{ steps.pages.outputs.base_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LT_ACESSO: ${{ secrets.LT_ACESSO }}
          LT_GH_TOKEN: ${{ secrets.LT_GH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python coletar_nuvem.py
      - name: Configurar o app novo (só a chave pública)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python gerar_config.py
      - name: Guardar cópia criptografada dos dados (ramo dados)
        if: hashFiles('site/dados/lotes.enc') != ''
        run: |
          mkdir -p /tmp/copia && cp site/dados/lotes.enc site/dados/acesso.json /tmp/copia/
          cd /tmp/copia && git init -q -b dados
          git config user.name "leilaotrack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Cópia dos dados (criptografada)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dados
      - name: Marcar versão do app
        run: sed -i "s/__VERSAO__/${GITHUB_SHA}/" site/index.html site/novo/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
