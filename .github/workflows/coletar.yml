name: Atualizar lotes

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 horas
  workflow_dispatch: {}       # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Manter o agendamento ativo
        # o GitHub pausa agendamentos de repositórios sem commits há 60 dias;
        # se o último commit tiver mais de 40 dias, faz um commit vazio
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 40*86400 )) ]; then
            git config user.name "leilaotrack-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter atualizações automáticas ativas"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar criptografia
        run: pip install cryptography
      - id: pages
        uses: actions/configure-pages@v5
      - name: Ler os sites
        env:
          URL_PUBLICADA: ${{ steps.pages.outputs.base_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LT_ACESSO: ${{ secrets.LT_ACESSO }}
        run: python coletar_nuvem.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
