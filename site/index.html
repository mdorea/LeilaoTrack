<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeilãoTrack</title>
<meta name="theme-color" content="#1E1640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeilãoTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-card:18px;--r-pill:999px;
}
:root,[data-tema="escuro"]{
  --bg1:#21184A;--bg2:#0B0A22;
  --orb1:rgba(140,90,255,.55);--orb2:rgba(255,120,90,.38);--orb3:rgba(60,170,255,.38);
  --glass:rgba(255,255,255,.085);--glass2:rgba(255,255,255,.13);--line:rgba(255,255,255,.16);
  --tx:#FFFFFF;--mu:#BEBAE0;--mu2:#8F8BB8;
  --price:#7CF0BE;--acc:#FF8A5B;--acc2:#FFB38A;--danger:#FF6B6B;--hot:#FF8A8A;
  --chip-on-bg:#FFFFFF;--chip-on-tx:#1E1640;
  --sheet:rgba(16,13,40,.86);--scrim:rgba(5,4,15,.55);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --track:#3A3560;
}
[data-tema="claro"]{
  --bg1:#FFF3EA;--bg2:#F1EDFA;
  --orb1:rgba(255,190,120,.55);--orb2:rgba(190,160,255,.42);--orb3:rgba(120,200,255,.42);
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.78);--line:rgba(255,255,255,.95);
  --tx:#1E1640;--mu:#6E6A8A;--mu2:#9A96B4;
  --price:#13915E;--acc:#E26A2C;--acc2:#E26A2C;--danger:#F0544B;--hot:#E04848;
  --chip-on-bg:#1E1640;--chip-on-tx:#FFFFFF;
  --sheet:rgba(255,255,255,.9);--scrim:rgba(40,30,70,.28);
  --shadow:0 10px 30px rgba(60,40,110,.13);
  --track:#DAD5EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--tx);background:var(--bg2);overflow-x:hidden;transition:color .4s}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.fundo{position:fixed;inset:0;z-index:-1;background:linear-gradient(170deg,var(--bg1),var(--bg2));overflow:hidden;transition:background .6s}
.fundo i{position:absolute;border-radius:50%;filter:blur(70px);transition:background .6s}
.fundo i:nth-child(1){width:420px;height:420px;right:-120px;top:-120px;background:var(--orb1)}
.fundo i:nth-child(2){width:460px;height:460px;left:-200px;top:38%;background:var(--orb2)}
.fundo i:nth-child(3){width:420px;height:420px;right:-160px;bottom:-140px;background:var(--orb3)}
.vidro{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 120px}
/* marca */
.marca{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#8C5AFF,#FF8A5B);box-shadow:0 6px 18px rgba(140,90,255,.35)}
.marca-txt{display:flex;flex-direction:column;line-height:1.15}
.marca-txt b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.marca-txt b span{background:linear-gradient(90deg,#B69CFF,#FF8A5B);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-tema="claro"] .marca-txt b span{background:linear-gradient(90deg,#6D3FE0,#E26A2C);-webkit-background-clip:text;background-clip:text}
.marca-txt small{font-size:11.5px;color:var(--mu);font-weight:500}
/* topo */
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.data{font-size:12.5px;color:var(--mu);font-weight:500}
.saudacao{font-size:clamp(24px,5.6vw,32px);font-weight:700;margin:2px 0 0;letter-spacing:-.3px;line-height:1.15}
.astro{width:46px;height:46px;flex:none;margin-top:4px}
/* busca */
.linha-busca{display:flex;gap:8px;margin-bottom:12px}
.busca{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:var(--r-pill)}
.busca input{flex:1;width:100%;border:0;outline:0;background:none;font-size:14px;min-width:0}
.busca input::placeholder{color:var(--mu)}
.busca svg{flex:none;opacity:.75}
.btn-ico{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge[hidden]{display:none!important}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -18px 12px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .15s,background .2s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-tx);border-color:transparent;font-weight:600}
.chip .x{opacity:.6;font-size:15px;line-height:1}
.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
/* números */
.numeros{display:grid;grid-template-columns:repeat(3,1fr);border-radius:18px;margin-bottom:18px;overflow:hidden}
.numeros button{padding:12px 4px;display:flex;align-items:baseline;justify-content:center;gap:5px;font-size:12px;white-space:nowrap;color:var(--mu);font-weight:500}
.numeros b{font-size:20px;color:var(--tx);font-weight:700}
.numeros button.on{background:var(--glass2)}
.numeros .n2 b{color:var(--acc2)}.numeros .n3 b{color:var(--hot)}
/* cabeçalho lista */
.cab{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;gap:10px}
.cab h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:8px}
.cab h2 small{font-size:12px;color:var(--mu);font-weight:500}
.ordem{height:32px;padding:0 12px;border-radius:12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
/* cards */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{display:flex;gap:12px;padding:9px;border-radius:var(--r-card);text-align:left;width:100%;position:relative;transition:transform .15s}
.card:active{transform:scale(.985)}
.foto{width:88px;height:88px;flex:none;border-radius:13px;overflow:hidden;background:linear-gradient(160deg,#EBCFAE,#9C6E52);display:grid;place-items:center;position:relative}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto.sem{background:var(--g,linear-gradient(160deg,#C5D7EA,#7E9FC3))}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.topo-card{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu);font-weight:500;padding-right:56px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.novo{color:var(--acc2);font-weight:600}
.tit{font-size:13.5px;font-weight:600;line-height:1.3;margin:3px 0 1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:30px}
.loc{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baixo{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:4px}
.preco{font-size:16px;font-weight:700;color:var(--price);letter-spacing:-.2px}
.quando{font-size:11px;color:var(--mu);font-weight:500;text-align:right;white-space:nowrap}
.quando.urg{color:var(--hot);font-weight:600}
.desc{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px}
.coracao{position:absolute;right:8px;top:34px;width:30px;height:30px;display:grid;place-items:center;color:var(--mu2)}
.coracao.on{color:#FF5C7A}
.vazio{padding:50px 20px;text-align:center;color:var(--mu);border-radius:var(--r-card)}
.mais{height:1px}
/* barra inferior */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(560px,calc(100% - 24px));height:60px;border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:20;box-shadow:var(--shadow);padding:0 6px}
.nav button{height:48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--mu)}
.nav button svg{width:20px;height:20px}
.nav button.on{color:var(--tx);font-weight:600;background:var(--glass2)}
/* folhas (sheets) */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:var(--sheet);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--line);border-bottom:0;transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:31;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.folha.on{transform:translate(-50%,0)}
.alca{width:40px;height:4px;border-radius:2px;background:var(--mu2);opacity:.6;margin:10px auto 0;flex:none}
.folha-cab{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;flex:none}
.folha-cab h3{margin:0;font-size:20px;font-weight:700}
.link{color:var(--acc2);font-size:13px;font-weight:600}
.folha-corpo{overflow-y:auto;padding:4px 20px 20px;-webkit-overflow-scrolling:touch}
.folha-pe{padding:12px 20px calc(env(safe-area-inset-bottom) + 16px);flex:none}
.sec{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--mu);text-transform:uppercase;margin:16px 0 9px;display:flex;justify-content:space-between}
.sec span{text-transform:none;letter-spacing:0;color:var(--tx);font-size:12.5px}
.btn-grande{width:100%;height:50px;border-radius:25px;background:var(--chip-on-bg);color:var(--chip-on-tx);font-weight:700;font-size:15px}
.btn-acc{background:var(--acc);color:#fff}
.btn-sec{width:100%;height:46px;border-radius:23px;font-weight:600;font-size:13.5px;margin-bottom:10px}
/* faixa dupla */
.faixa{position:relative;height:28px}
.faixa .trilho{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:var(--track)}
.faixa .ativo{position:absolute;top:12px;height:5px;border-radius:3px;background:#B69CFF}
.faixa.laranja .ativo{background:var(--acc)}
.faixa input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;height:28px}
.faixa input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--chip-on-bg);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.faixa input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--chip-on-bg);cursor:pointer}
.faixa input::-webkit-slider-runnable-track{background:none}
.mini-busca{width:100%;height:38px;border-radius:12px;padding:0 12px;border:1px solid var(--line);background:var(--glass);outline:0;font-size:13px;margin-bottom:8px}
/* ordenação */
.opcao{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;border-radius:14px;text-align:left;margin-bottom:4px}
.opcao.on{background:var(--glass2);border:1px solid var(--line)}
.opcao b{display:block;font-size:14px;font-weight:600}.opcao small{color:var(--mu);font-size:11.5px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--mu2);display:grid;place-items:center;flex:none}
.opcao.on .radio{border-color:var(--tx)}.opcao.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
/* detalhe */
.det-foto{height:230px;margin:-4px -20px 0;position:relative;overflow:hidden;background:linear-gradient(160deg,#EBCFAE,#9C6E52)}
.det-foto img{width:100%;height:100%;object-fit:cover}
.det-site{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin:16px 0 4px}
.det-tit{font-size:20px;font-weight:700;margin:0 0 4px;line-height:1.25}
.det-end{font-size:12.5px;color:var(--mu);margin-bottom:14px}
.caixa{border-radius:18px;padding:16px;margin-bottom:12px}
.caixa .r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rot{font-size:11.5px;color:var(--mu)}
.valor-grande{font-size:26px;font-weight:700;color:var(--price);letter-spacing:-.4px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:9px;background:var(--danger);color:#fff;white-space:nowrap}
.sep{height:1px;background:var(--line);margin:12px 0}
.linhas div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.linhas div:last-child{border:0}
.linhas span:first-child{color:var(--mu)}
.linhas span:last-child{text-align:right;font-weight:500}
.praca-passada{opacity:.5;text-decoration:line-through}
.eventos{font-size:12.5px}
.eventos div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.eventos time{color:var(--mu);flex:none;font-size:11.5px;width:78px}
/* alertas / ajustes */
.lista-ev{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;text-align:left;width:100%}
.ev .foto{width:56px;height:56px;border-radius:11px}
.ev p{margin:0;font-size:13px;font-weight:600}.ev small{color:var(--mu);font-size:11.5px;display:block;margin-top:2px}
.ev .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--glass2);margin-right:6px}
.dia{font-size:12px;font-weight:600;color:var(--mu);margin:14px 2px 2px}
.painel{border-radius:20px;padding:16px;margin-bottom:12px}
.painel h4{margin:0 0 10px;font-size:15px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12px;color:var(--mu)}
.campo input,.campo select{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);padding:0 12px;font-size:14px;outline:0;color:var(--tx)}
.site-st{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.site-st:last-child{border:0}
.ok{color:var(--price)}.erro{color:var(--hot)}
.texto-ajuda{font-size:12.5px;color:var(--mu);line-height:1.55}
.texto-ajuda b{color:var(--tx)}
.end-rede{font-size:17px;font-weight:700;margin:6px 0;word-break:break-all;color:var(--tx)}
.atualizando{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mu)}
.spin{width:12px;height:12px;border:2px solid var(--mu2);border-top-color:transparent;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:14px;background:var(--chip-on-bg);color:var(--chip-on-tx);font-size:13px;font-weight:600;transition:.25s;z-index:50;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.esq{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (max-width:400px){.numeros button{font-size:11px}.numeros b{font-size:18px}}
@media (min-width:900px){
  .app{padding-top:34px}
  .topo{margin-bottom:22px}
  .chips{margin:0 0 14px;padding:2px 0 4px}
  .numeros{max-width:560px}
  .foto{width:104px;height:104px}
}
/* carregando */
.carregando{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:linear-gradient(170deg,var(--bg1),var(--bg2));transition:opacity .45s ease,visibility .45s}
.carregando.saindo{opacity:0;visibility:hidden}
.carregando[hidden]{display:none}
.car-box{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
.palco{position:relative;width:132px;height:132px;display:grid;place-items:center}
.onda{position:absolute;left:50%;top:106px;width:60px;height:16px;margin:-8px 0 0 -30px;border-radius:50%;border:2px solid var(--acc);opacity:0;animation:onda 1.3s cubic-bezier(.2,.7,.3,1) infinite}
.onda:nth-child(2){animation-delay:.12s;border-color:#B69CFF}
.onda:nth-child(3){animation-delay:.24s}
@keyframes onda{0%,38%{transform:scale(.4);opacity:0}42%{opacity:.9}100%{transform:scale(2.6);opacity:0}}
.base{position:absolute;left:50%;top:100px;width:70px;height:12px;margin-left:-35px;border-radius:6px;background:linear-gradient(90deg,#8C5AFF,#FF8A5B);box-shadow:0 8px 22px rgba(255,138,91,.35);animation:base 1.3s ease-in-out infinite}
@keyframes base{0%,38%{transform:scaleY(1)}42%{transform:scaleY(.6) scaleX(1.08)}55%,100%{transform:scaleY(1)}}
.martelo{position:absolute;inset:0;width:132px;height:132px;transform-origin:118px 80px;animation:martelo 1.3s cubic-bezier(.5,0,.3,1) infinite}
@keyframes martelo{0%{transform:rotate(40deg)}38%{transform:rotate(0deg)}46%{transform:rotate(7deg)}54%{transform:rotate(1deg)}100%{transform:rotate(40deg)}}38%{transform:rotate(8deg)}46%{transform:rotate(-4deg)}60%{transform:rotate(-14deg)}100%{transform:rotate(-58deg)}}
.faisca{position:absolute;left:50%;top:98px;width:4px;height:4px;border-radius:50%;background:#FFD08A;opacity:0;animation:faisca 1.3s ease-out infinite}
@keyframes faisca{0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}75%,100%{opacity:0;transform:translate(var(--x),var(--y))}}
.car-marca{font-size:26px;font-weight:700;letter-spacing:-.4px;background:linear-gradient(90deg,var(--tx) 0%,var(--tx) 35%,#FFB38A 50%,var(--tx) 65%,var(--tx) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilho 2.4s linear infinite}
.car-marca span{color:transparent}
@keyframes brilho{from{background-position:100% 0}to{background-position:-150% 0}}
.car-msg{font-size:13px;color:var(--mu);font-weight:500;height:20px;text-align:center;transition:opacity .25s}
.barra{width:180px;height:4px;border-radius:2px;background:var(--track);overflow:hidden;position:relative}
.barra i{position:absolute;inset:0;width:40%;border-radius:2px;background:linear-gradient(90deg,#8C5AFF,#FF8A5B);animation:barra 1.4s ease-in-out infinite}
@keyframes barra{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
/* esqueleto dos cards */
.esqueleto{display:flex;gap:12px;padding:9px;border-radius:var(--r-card)}
.esqueleto .f,.esqueleto .l{background:linear-gradient(90deg,var(--glass) 0%,var(--glass2) 50%,var(--glass) 100%);background-size:200% 100%;animation:pele 1.2s linear infinite;border-radius:10px}
.esqueleto .f{width:88px;height:88px;flex:none;border-radius:13px}
.esqueleto .ls{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:6px}
.esqueleto .l{height:11px}
@keyframes pele{from{background-position:200% 0}to{background-position:-200% 0}}
/* login */
.login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.login[hidden]{display:none}
.login-card{width:min(380px,100%);border-radius:26px;padding:28px 24px 24px;box-shadow:var(--shadow)}
.login-card .marca{margin-bottom:22px}
.login-card h2{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 18px;color:var(--mu);font-size:13px}
.login-card .campo input{height:48px;font-size:15px}

</style>

  <button data-aba="alertas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>Alertas</button>

  <div class="car-box">
    <div class="palco" aria-hidden="true">

      <svg class="martelo" viewBox="0 0 132 132"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B69CFF"/><stop offset="1" stop-color="#FF8A5B"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E3D2"/><stop offset="1" stop-color="#C9A88A"/></linearGradient></defs>
        <rect x="64" y="76" width="56" height="8" rx="4" fill="url(#gc)"/>
        <rect x="53" y="58" width="26" height="42" rx="7" fill="url(#gm)"/>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("ml_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ml_"+k,JSON.stringify(v))}catch(e){}}};
const SITE_COR={"Frazão":"#E0694F","Zuk":"#4C8BF5","Mega":"#2FB37A"};
const GRADS=["linear-gradient(160deg,#EBCFAE,#B4876A)","linear-gradient(160deg,#C5D7EA,#7E9FC3)","linear-gradient(160deg,#CBE4D3,#84B598)","linear-gradient(160deg,#E6D8EE,#A68ABD)","linear-gradient(160deg,#EFE3B8,#C3A866)"];
const CASA='<svg width="42%" viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>';
const ORDENS=[
  ["desconto","Maior desconto","sobre a 1ª praça"],["menor","Menor valor",""],["maior","Maior valor",""],
  ["encerra","Encerra primeiro","próximos leilões no topo"],["recentes","Mais recentes","entrou por último"],["lances","Mais lances","mais disputados"]];
const FILTRO0={sites:[],tipos:[],pracas:[],ocup:[],ufs:[],cidades:[],vmin:0,vmax:0,dmin:0,prazo:"",novos:false,fecham:false};
const VMAX=3000000;

let ESTATICO=false;let CHAVE=null;
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derivarChave(usuario,senha){
  const a=await (await fetch("dados/acesso.json?t="+Date.now(),{cache:"no-store"})).json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(usuario.trim().toLowerCase()+":"+senha),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(a.sal),iterations:a.iteracoes,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function ler(nome,chave){
  const e=await (await fetch(`dados/${nome}.enc?t=${Date.now()}`,{cache:"no-store"})).json();
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(e.iv)},chave||CHAVE,b64d(e.dados));
  return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
function guardarChave(raw,lembrar){const v=btoa(String.fromCharCode(...new Uint8Array(raw)));try{(lembrar?localStorage:sessionStorage).setItem("lt_chave",v)}catch(e){}}
function chaveGuardada(){try{return localStorage.getItem("lt_chave")||sessionStorage.getItem("lt_chave")}catch(e){return null}}
function sair(){try{localStorage.removeItem("lt_chave");sessionStorage.removeItem("lt_chave")}catch(e){}location.reload()}
function mostrarLogin(){esconderCarregando();document.body.classList.add("travado");$("#login").hidden=false;setTimeout(()=>$("#lg-usuario").focus(),100)}
async function iniciarProtegido(){
  const g=chaveGuardada();
  if(g){try{const k=await crypto.subtle.importKey("raw",b64d(g),{name:"AES-GCM"},true,["decrypt"]);await ler("estado",k);CHAVE=k;return carregar()}catch(e){}}
  mostrarLogin();
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="form-login")return;e.preventDefault();
  const bt=$("#lg-entrar");bt.disabled=true;bt.textContent="Entrando…";$("#lg-erro").textContent="";mostrarCarregando("login");
  try{const k=await derivarChave($("#lg-usuario").value,$("#lg-senha").value);await ler("estado",k);
    CHAVE=k;guardarChave(await crypto.subtle.exportKey("raw",k),$("#lg-lembrar").checked);
    $("#login").hidden=true;document.body.classList.remove("travado");$("#lg-senha").value="";carregar();
  }catch(err){$("#carregando").classList.add("saindo");setTimeout(()=>{$("#carregando").hidden=true},450);$("#lg-erro").textContent="Usuário ou senha incorretos.";const c=$("#form-login");c.classList.remove("tremer");void c.offsetWidth;c.classList.add("tremer")}
  bt.disabled=false;bt.textContent="Entrar";
});
const FAVS=new Set(LS.get("favs",[]));
let S={lotes:[],estado:{},filtro:Object.assign({},FILTRO0,LS.get("filtro",{})),ordem:LS.get("ordem","desconto"),busca:"",aba:"inicio",lista:[],mostrados:0,tema:LS.get("tema","auto"),rascunho:null,cidadeBusca:""};

/* ---------------- tema, saudação ---------------- */
function hora(){return new Date().getHours()}
function aplicarTema(){
  const h=hora();const dia=h>=6&&h<18;
  const t=S.tema==="auto"?(dia?"claro":"escuro"):S.tema;
  document.documentElement.dataset.tema=t;
  document.querySelector('meta[name=theme-color]').content=t==="claro"?"#FFF3EA":"#1E1640";
  const nome=S.estado.nome||"";
  const s=h>=5&&h<12?"Bom dia":h>=12&&h<18?"Boa tarde":"Boa noite";
  $("#saudacao").textContent=nome?`${s}, ${nome}`:s;
  const d=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  $("#data").textContent=d.charAt(0).toUpperCase()+d.slice(1);
  $("#astro").innerHTML=(h>=6&&h<18)
    ?'<svg viewBox="0 0 48 48"><g stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round">'+[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${24+Math.cos(r)*15}" y1="${24+Math.sin(r)*15}" x2="${24+Math.cos(r)*20}" y2="${24+Math.sin(r)*20}"/>`}).join("")+'</g><circle cx="24" cy="24" r="10.5" fill="#F7B733"/></svg>'
    :'<svg viewBox="0 0 48 48"><circle cx="22" cy="25" r="13" fill="#F4D58D"/><circle cx="29" cy="20" r="12" fill="var(--bg1)"/><circle cx="38" cy="10" r="1.3" fill="#C9D3EE"/><circle cx="42" cy="24" r="1" fill="#C9D3EE"/><circle cx="10" cy="8" r="1.1" fill="#C9D3EE"/></svg>';
}

/* ---------------- formatação ---------------- */
const fmtBRL=v=>v==null?"—":"R$ "+Math.round(v).toLocaleString("pt-BR");
const fmtCurto=v=>v>=1e6?`R$ ${(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})} mi`:`R$ ${Math.round(v/1000)} mil`;
const dt=s=>s?new Date(s):null;
function fmtData(s){if(!s)return"";const d=dt(s);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+(d.getHours()||d.getMinutes()?` às ${String(d.getHours()).padStart(2,"0")}h${d.getMinutes()?String(d.getMinutes()).padStart(2,"0"):""}`:"")}
function falta(s){if(!s)return"";const ms=dt(s)-Date.now();if(ms<0)return"encerrado";const h=ms/36e5;if(h<1)return`fecha em ${Math.max(1,Math.round(ms/6e4))} min`;if(h<48)return`fecha em ${Math.round(h)}h`;return`em ${Math.round(h/24)} dias`}
function pracaCurta(n){n=(n||"").toLowerCase();if(/2/.test(n))return"2ª praça";if(/1/.test(n))return"1ª praça";if(/[uú]nic/.test(n))return"Praça única";return n?n.charAt(0).toUpperCase()+n.slice(1):"Leilão"}
function pracaChave(n){n=(n||"").toLowerCase();if(/2/.test(n))return"2ª praça";if(/1/.test(n))return"1ª praça";return"Praça única"}
function ocupChave(l){const o=(l.ocupacao||"").toLowerCase();if(o.includes("desocup"))return"Desocupado";if(o.includes("ocup"))return"Ocupado";return"Não informado"}
function grad(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return GRADS[h%GRADS.length]}
function foto(l,cls=""){
  const g=grad(l.id);
  if(!l.imagem)return`<div class="foto sem ${cls}" style="--g:${g}">${CASA}</div>`;
  return`<div class="foto ${cls}" style="background:${g}"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(l.imagem)}" alt="" onerror="this.parentNode.classList.add('sem');this.parentNode.style.setProperty('--g','${g}');this.outerHTML='${CASA.replace(/"/g,"&quot;")}'"></div>`;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}

/* ---------------- tela de carregamento ---------------- */
const MSGS={inicio:["Preparando seus leilões…","Buscando lotes da Frazão…","Consultando o Portal Zuk…","Organizando a Mega Leilões…","Calculando os descontos…"],
  login:["Conferindo seu acesso…","Abrindo o cofre dos lotes…","Organizando os leilões…"]};
let _carT=null,_carIni=0;
function mostrarCarregando(tipo){
  const c=$("#carregando"),m=$("#car-msg");const lista=MSGS[tipo]||MSGS.inicio;let i=0;
  c.hidden=false;c.classList.remove("saindo");_carIni=Date.now();m.textContent=lista[0];clearInterval(_carT);
  _carT=setInterval(()=>{i=(i+1)%lista.length;m.style.opacity=0;setTimeout(()=>{m.textContent=lista[i];m.style.opacity=1},220)},1300);
}
function esconderCarregando(){
  const espera=Math.max(0,900-(Date.now()-_carIni));
  setTimeout(()=>{const c=$("#carregando");c.classList.add("saindo");clearInterval(_carT);setTimeout(()=>{if(c.classList.contains("saindo"))c.hidden=true},500)},espera);
}
function esqueletos(n){return Array.from({length:n},()=>`<div class="esqueleto vidro"><div class="f"></div><div class="ls"><div class="l" style="width:40%"></div><div class="l" style="width:90%"></div><div class="l" style="width:60%"></div><div class="l" style="width:35%;height:15px;margin-top:4px"></div></div></div>`).join("")}

/* ---------------- dados ---------------- */
async function carregar(silencioso){
  try{
    let d;
    if(ESTATICO){
      d=await ler("lotes");
      const corte=fmtLocal(Date.now()-864e5);
      for(const l of d.lotes){l.fav=FAVS.has(l.id);l.novo=!l.primeira_leitura&&(l.visto||"")>=corte}
      d.estado.nome=LS.get("nome","Márcio");
    }else d=await (await fetch("/api/lotes",{cache:"no-store"})).json();
    S.lotes=d.lotes;S.estado=d.estado;
    for(const l of S.lotes){l._busca=[l.titulo,l.bairro,l.cidade,l.uf,l.endereco,l.codigo,l.id,l.comitente,l.tipo,l.site].join(" ").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();l._enc=l.encerra?dt(l.encerra).getTime():Infinity}
    aplicarTema();render();esconderCarregando();
    if(S.aba==="ajustes")renderAjustes();
  }catch(e){esconderCarregando();if(!silencioso)$("#grade").innerHTML=`<div class="vazio vidro">Não consegui falar com o programa no computador.<br><small>Ele está aberto? Tente de novo em instantes.</small></div>`}
}

function filtrar(base,f,ignorar){
  const agora=Date.now();const q=S.busca.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().split(/\s+/).filter(Boolean);
  return base.filter(l=>{
    if(!l.ativo&&S.aba!=="favoritos")return false;
    if(l.encerrado&&S.aba!=="favoritos")return false;
    if(q.length&&!q.every(w=>l._busca.includes(w)))return false;
    if(f.sites.length&&!f.sites.includes(l.site))return false;
    if(f.tipos.length&&!f.tipos.includes(l.tipo))return false;
    if(f.pracas.length&&!f.pracas.includes(pracaChave(l.praca_atual)))return false;
    if(f.ocup.length&&!f.ocup.includes(ocupChave(l)))return false;
    if(f.ufs.length&&!f.ufs.includes(l.uf))return false;
    if(ignorar!=="cidades"&&f.cidades.length&&!f.cidades.includes(l.cidade+"/"+l.uf))return false;
    if(f.vmin&&(l.valor||0)<f.vmin)return false;
    if(f.vmax&&f.vmax<VMAX&&(l.valor||0)>f.vmax)return false;
    if(f.dmin&&(l.desconto||0)<f.dmin)return false;
    if(f.prazo){const lim={hoje:new Date().setHours(23,59,59,999),"7":agora+7*864e5,"30":agora+30*864e5}[f.prazo];if(!(l._enc<=lim))return false}
    if(f.novos&&!l.novo)return false;
    if(f.fecham&&!(l._enc-agora<=48*36e5))return false;
    return true;
  });
}
function ordenar(a){
  const o=S.ordem;const by={
    desconto:(x,y)=>(y.desconto||0)-(x.desconto||0)||(x.valor||0)-(y.valor||0),
    menor:(x,y)=>(x.valor||9e12)-(y.valor||9e12),maior:(x,y)=>(y.valor||0)-(x.valor||0),
    encerra:(x,y)=>x._enc-y._enc,recentes:(x,y)=>(y.visto||"").localeCompare(x.visto||"")||x._enc-y._enc,
    lances:(x,y)=>(y.lances||0)-(x.lances||0)}[o];
  return a.sort(by);
}
function qtdFiltros(f){return["sites","tipos","pracas","ocup","ufs","cidades"].reduce((n,k)=>n+(f[k].length?1:0),0)+(f.vmin||(f.vmax&&f.vmax<VMAX)?1:0)+(f.dmin?1:0)+(f.prazo?1:0)}

/* ---------------- render início ---------------- */
function render(){
  if(S.aba==="alertas"||S.aba==="ajustes")return;
  const base=S.aba==="favoritos"?S.lotes.filter(l=>l.fav):S.lotes;
  const f=S.filtro;
  S.lista=ordenar(filtrar(base,f));
  const semRapido=filtrar(base,Object.assign({},f,{novos:false,fecham:false}));
  const agora=Date.now();

function renderChips(){
  const f=S.filtro;const c=[];
  const rem=(k,v,t)=>c.push(`<button class="chip on" data-rem="${k}" data-v="${esc(v)}">${esc(t)} <span class="x">×</span></button>`);
  f.tipos.forEach(t=>rem("tipos",t,t));f.ufs.forEach(t=>rem("ufs",t,t));f.cidades.forEach(t=>rem("cidades",t,t.split("/")[0]));
  f.sites.forEach(t=>rem("sites",t,t));f.pracas.forEach(t=>rem("pracas",t,t));f.ocup.forEach(t=>rem("ocup",t,t));
  if(f.vmin||(f.vmax&&f.vmax<VMAX))rem("valor","",f.vmin&&f.vmax&&f.vmax<VMAX?`${fmtCurto(f.vmin)}–${fmtCurto(f.vmax).replace("R$ ","")}`:f.vmin?`a partir de ${fmtCurto(f.vmin)}`:`até ${fmtCurto(f.vmax)}`);
  if(f.dmin)rem("dmin","",`${f.dmin}%+ off`);
  if(f.prazo)rem("prazo","",{hoje:"Fecha hoje","7":"Até 7 dias","30":"Até 30 dias"}[f.prazo]);
  const rapidos=[["Apartamento","tipos"],["Casa","tipos"],["Terreno","tipos"],["Desocupado","ocup"]].filter(([v,k])=>!f[k].includes(v));
  rapidos.forEach(([v,k])=>c.push(`<button class="chip vidro" data-add="${k}" data-v="${v}">${v}</button>`));
  if(!f.dmin)c.push(`<button class="chip vidro" data-add="dmin" data-v="30">30%+ off</button>`);
  if(!f.vmax)c.push(`<button class="chip vidro" data-add="vmax" data-v="300000">até 300 mil</button>`);
  $("#chips").innerHTML=c.join("");
}

  atualizarFaixas();

  let dia="";const out=[];const nomes={novo:"NOVO",valor:"VALOR",lance:"LANCE",status:"SITUAÇÃO",data:"DATA",saiu:"SAIU"};

  if(ESTATICO)return renderAjustesNuvem();
  const est=S.estado;let cfg={};try{cfg=await (await fetch("/api/config")).json()}catch(e){}
  const sites=["Zuk","Frazão","Mega"].map(s=>{const i=(est.sites||{})[s]||{};return`<div class="site-st"><span><i class="dot" style="display:inline-block;background:${SITE_COR[s]};margin-right:8px"></i>${{Zuk:"Portal Zuk",Mega:"Mega Leilões","Frazão":"Frazão Leilões"}[s]}</span><span class="${i.status==="erro"||i.status==="pausado"?"erro":i.status==="ok"?"ok":""}">${i.status==="ok"||(i.status==="pausado"&&i.lotes)?`${(i.lotes||0).toLocaleString("pt-BR")} lotes · ${new Date(i.quando).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:i.status==="erro"?"erro ao ler":i.status==="pausado"?"em pausa":i.status==="coletando"?"lendo…":"aguardando"}</span></div>${i.status==="erro"||i.status==="pausado"?`<div class="texto-ajuda erro" style="font-size:11px">${esc(i.erro)}</div>`:""}`}).join("");
  const a=cfg.alerta||{};
  $("#aba-ajustes").innerHTML=`
  <div class="cab"><h2>Ajustes</h2></div>
  <div class="painel vidro"><h4>Atualização</h4>${sites}
    <p class="texto-ajuda">Última: <b>${est.ultima?new Date(est.ultima).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—"}</b> · próxima: <b>${est.proxima?new Date(est.proxima).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"—"}</b>. O painel mostra os lotes novos assim que cada leitura termina.</p>
    <button class="btn-grande" id="atualizar">${est.rodando?"Atualizando…":"Atualizar agora"}</button></div>
  <div class="painel vidro"><h4>Abrir no celular</h4>
    <p class="texto-ajuda">Com o celular no <b>mesmo Wi-Fi</b> deste computador, abra no navegador:</p>
    <div class="end-rede">${esc(est.endereco_rede||"")}</div>
    <p class="texto-ajuda">Depois toque em <b>Compartilhar › Adicionar à Tela de Início</b> (iPhone) ou <b>⋮ › Adicionar à tela inicial</b> (Android) para virar um app.</p></div>
  <div class="painel vidro"><h4>Aparência</h4>
    <div class="chips wrap" id="temas">${[["auto","Automático (dia/noite)"],["claro","Claro"],["escuro","Escuro"]].map(([v,t])=>`<button class="chip ${S.tema===v?"on":"vidro"}" data-tema="${v}">${t}</button>`).join("")}</div>
    <label class="campo" style="margin-top:14px">Seu nome na saudação<input id="cfg-nome" value="${esc(cfg.nome||"")}"></label>
    <label class="campo">Atualizar os sites a cada<select id="cfg-int">${[[30,"30 minutos"],[60,"1 hora"],[120,"2 horas"],[240,"4 horas"],[360,"6 horas"]].map(([m,t])=>`<option value="${m}" ${+cfg.intervalo_minutos===m?"selected":""}>${t}</option>`).join("")}</select></label>
    <button class="btn-sec vidro" id="salvar-geral">Salvar</button></div>
  <div class="painel vidro"><h4>Avisos no Telegram ${est.telegram?'<span class="ok" style="font-size:12px">● conectado</span>':""}</h4>
    <p class="texto-ajuda">1. No Telegram, fale com <b>@BotFather</b>, envie <b>/newbot</b> e copie o código (token).<br>2. Cole abaixo e salve.<br>3. Mande um "oi" para o seu bot e toque em <b>Conectar</b>.</p>
    <label class="campo">Token do bot<input id="tg-token" value="${esc(cfg.telegram_token||"")}" placeholder="123456:ABC…"></label>
    <div style="display:flex;gap:8px"><button class="btn-sec vidro" id="tg-salvar">Salvar token</button><button class="btn-sec vidro" id="tg-conectar">Conectar</button><button class="btn-sec vidro" id="tg-teste">Testar</button></div>
    <p class="texto-ajuda">Você recebe aviso de <b>lotes novos</b> que batem com o seu alerta e de <b>mudanças nos favoritos</b>.<br>Alerta atual: <b>${esc([a.tipos&&a.tipos.join(", "),a.ufs&&a.ufs.join(", "),a.cidades&&a.cidades.map(c=>c.split("/")[0]).join(", "),a.valor_max?"até "+fmtCurto(a.valor_max):"",a.desconto_min?a.desconto_min+"%+ off":""].filter(Boolean).join(" · ")||"todos os lotes novos")}</b></p>
    <button class="btn-sec vidro" id="usar-filtros">Usar meus filtros atuais como alerta</button></div>
  <p class="texto-ajuda" style="text-align:center;padding:6px 20px 20px">O LeilãoTrack lê só as listagens públicas da Frazão, Portal Zuk e Mega Leilões. Dar lance é sempre no site oficial.</p>`;
  const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(r=>r.json());
  $("#atualizar").onclick=async()=>{await post("/api/atualizar");S.estado.rodando=true;toast("Atualizando os sites…");$("#atualizar").textContent="Atualizando…"};
  $("#temas").onclick=e=>{const b=e.target.closest("[data-tema]");if(!b)return;S.tema=b.dataset.tema;LS.set("tema",S.tema);aplicarTema();renderAjustes()};
  $("#salvar-geral").onclick=async()=>{await post("/api/config",{nome:$("#cfg-nome").value.trim(),intervalo_minutos:+$("#cfg-int").value});S.estado.nome=$("#cfg-nome").value.trim();aplicarTema();toast("Salvo")};
  $("#tg-salvar").onclick=async()=>{await post("/api/config",{telegram_token:$("#tg-token").value.trim()});toast("Token salvo")};
  $("#tg-conectar").onclick=async()=>{const r=await post("/api/telegram/descobrir");toast(r.ok?"Conectado!":"Mande um \"oi\" para o bot e tente de novo");if(r.ok){await post("/api/telegram/teste");S.estado.telegram=true;renderAjustes()}};
  $("#tg-teste").onclick=async()=>{const r=await post("/api/telegram/teste");toast(r.ok?"Mensagem enviada":"Não deu — confira token e conexão")};
  $("#usar-filtros").onclick=async()=>{const f=S.filtro;await post("/api/config",{alerta:{tipos:f.tipos,ufs:f.ufs,cidades:f.cidades.map(c=>c.split("/")[0]),valor_max:f.vmax||0,desconto_min:f.dmin||0}});toast("Alerta atualizado");renderAjustes()};
}

function statusSites(est){return["Zuk","Frazão","Mega"].map(s=>{const i=(est.sites||{})[s]||{};return`<div class="site-st"><span><i class="dot" style="display:inline-block;background:${SITE_COR[s]};margin-right:8px"></i>${{Zuk:"Portal Zuk",Mega:"Mega Leilões","Frazão":"Frazão Leilões"}[s]}</span><span class="${i.status==="ok"?"ok":i.status?"erro":""}">${i.status==="ok"?`${(i.lotes||0).toLocaleString("pt-BR")} lotes · ${new Date(i.quando).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:i.status==="pausado"?"em pausa":i.status==="erro"?"erro ao ler":"aguardando"}</span></div>${i.erro?`<div class="texto-ajuda erro" style="font-size:11px">${esc(i.erro)}</div>`:""}`}).join("")}
function renderAjustesNuvem(){
  const est=S.estado;const f=d=>d?new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
  $("#aba-ajustes").innerHTML=`<div class="cab"><h2>Ajustes</h2></div>
  <div class="painel vidro"><h4>Atualização automática</h4>${statusSites(est)}
    <p class="texto-ajuda">Os sites são lidos na nuvem a cada <b>2 horas</b>, mesmo com o computador desligado.<br>Última leitura: <b>${f(est.ultima)}</b> · próxima: <b>~${f(est.proxima)}</b></p></div>
  <div class="painel vidro"><h4>Instalar no celular</h4>
    <p class="texto-ajuda">Abra este mesmo endereço no celular e toque em <b>Compartilhar › Adicionar à Tela de Início</b> (iPhone) ou <b>⋮ › Adicionar à tela inicial</b> (Android).</p>
    <div class="end-rede">${esc(location.href.split("#")[0].split("?")[0])}</div>
    <p class="texto-ajuda">Os favoritos ficam salvos em cada aparelho.</p></div>
  <div class="painel vidro"><h4>Aparência</h4>
    <div class="chips wrap" id="temas">${[["auto","Automático (dia/noite)"],["claro","Claro"],["escuro","Escuro"]].map(([v,t])=>`<button class="chip ${S.tema===v?"on":"vidro"}" data-tema="${v}">${t}</button>`).join("")}</div>
    <label class="campo" style="margin-top:14px">Seu nome na saudação<input id="cfg-nome" value="${esc(LS.get("nome","Márcio"))}"></label>
    <button class="btn-sec vidro" id="salvar-geral">Salvar</button></div>
  <div class="painel vidro"><h4>Conta</h4><p class="texto-ajuda">O acesso fica lembrado neste aparelho até você sair.</p><button class="btn-sec vidro" id="sair">Sair deste aparelho</button></div>
  <p class="texto-ajuda" style="text-align:center;padding:6px 20px 20px">O LeilãoTrack lê só as listagens públicas da Frazão, Portal Zuk e Mega Leilões. Dar lance é sempre no site oficial.</p>`;
  $("#temas").onclick=e=>{const b=e.target.closest("[data-tema]");if(!b)return;S.tema=b.dataset.tema;LS.set("tema",S.tema);aplicarTema();renderAjustesNuvem()};
  $("#sair").onclick=sair;
  $("#salvar-geral").onclick=()=>{LS.set("nome",$("#cfg-nome").value.trim());S.estado.nome=$("#cfg-nome").value.trim();aplicarTema();toast("Salvo")};
}
/* ---------------- início ---------------- */
aplicarTema();
$("#grade").innerHTML=esqueletos(6);mostrarCarregando("inicio");
(async()=>{try{const r=await fetch("/api/estado",{cache:"no-store"});ESTATICO=!r.ok||!(r.headers.get("content-type")||"").includes("json")}catch(e){ESTATICO=true}
  if(ESTATICO)iniciarProtegido();else carregar()})();
// só baixa os lotes de novo quando o programa terminou uma nova leitura dos sites
async function verificar(){
  aplicarTema();
  if(ESTATICO&&!CHAVE)return;
  try{const e=ESTATICO?await ler("estado"):await (await fetch("/api/estado",{cache:"no-store"})).json();if(ESTATICO)e.nome=LS.get("nome","Márcio");
    const mudou=e.ultima!==S.estado.ultima;const rodava=S.estado.rodando;S.estado=Object.assign(S.estado,e);
    if(mudou&&!folhaAberta){const y=window.scrollY;await carregar(true);window.scrollTo(0,y);toast("Lotes atualizados")}
    else if(rodava!==e.rodando&&S.aba!=="ajustes")$("#qtd").innerHTML=`${S.lista.length.toLocaleString("pt-BR")} lotes`+(e.rodando?` · <span class="atualizando"><i class="spin"></i>atualizando</span>`:"");
  }catch(err){}
}
setInterval(verificar,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)verificar()});
</script>
</body>
</html>
